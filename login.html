<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Terminal - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo i {
            font-size: 48px;
            color: #e8662c;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 22px;
            color: #2c3e50;
            font-weight: 600;
        }
        .login-logo p {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #e8662c;
            box-shadow: 0 0 0 3px rgba(232,102,44,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #e8662c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #d4551b;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
        .login-footer a {
            color: #e8662c;
            text-decoration: none;
        }
        .demo-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #0369a1;
        }
        .demo-info strong {
            display: block;
            margin-bottom: 4px;
        }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-credit-card"></i>
            <h1>Virtual Terminal</h1>
            <p>Payment Processing Gateway</p>
        </div>

        <div class="demo-info">
            <strong><i class="fas fa-info-circle"></i> Demo Erişimi</strong>
            Kullanıcı: <code>admin</code> | Şifre: <code>admin123</code><br>
            veya <code>demo</code> / <code>demo123</code>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i> Geçersiz kullanıcı adı veya şifre.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Kullanıcı Adı / Merchant ID</label>
                <input type="text" id="username" placeholder="Kullanıcı adınızı girin" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="Şifrenizi girin" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </button>
        </form>

        <div class="login-footer">
            <a href="#">Şifremi unuttum</a> &nbsp;|&nbsp; <a href="#">Destek</a>
            <p style="margin-top:12px;">&copy; 2026 Virtual Terminal Gateway</p>
        </div>
    </div>

    <script>
        const validUsers = [
            { user: 'admin', pass: 'admin123', name: 'Admin User' },
            { user: 'demo', pass: 'demo123', name: 'Demo Merchant' },
            { user: 'merchant', pass: 'merchant1', name: 'Test Merchant' }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const found = validUsers.find(u => u.user === username && u.pass === password);
            if (found) {
                sessionStorage.setItem('vt_user', JSON.stringify(found));
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('errorMsg').style.display = 'none';
                }, 3000);
            }
        });

        if (sessionStorage.getItem('vt_user')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
